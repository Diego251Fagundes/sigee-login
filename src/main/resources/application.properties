spring.application.name=sigee-login

# A URI do MongoDB Atlas deve ser informada pela variavel de ambiente MONGODB_URI.
# O valor padrao nao possui credenciais e permite usar um MongoDB local durante o desenvolvimento.
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/sigee_login}
spring.data.mongodb.auto-index-creation=true

spring.session.timeout=30m

# A criacao do primeiro administrador e opcional e usa somente variaveis de ambiente.
sigee.admin-inicial.enabled=${SIGEE_ADMIN_INICIAL_ENABLED:false}
sigee.admin-inicial.nome=${SIGEE_ADMIN_INICIAL_NOME:}
sigee.admin-inicial.sobrenome=${SIGEE_ADMIN_INICIAL_SOBRENOME:}
sigee.admin-inicial.email=${SIGEE_ADMIN_INICIAL_EMAIL:}
sigee.admin-inicial.nome-usuario=${SIGEE_ADMIN_INICIAL_NOME_USUARIO:}
sigee.admin-inicial.senha=${SIGEE_ADMIN_INICIAL_SENHA:}
