<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
		xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Inicio | SIGEE</title>
	<link rel="stylesheet" th:href="@{/css/theme.css}">
	<link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
	<header th:replace="~{fragments/topbar :: topbar(false)}"></header>

	<main class="page page-narrow">
		<section class="page-heading" aria-labelledby="titulo-pagina">
			<p class="eyebrow">Sistema Integrado de Gestao de Equipamentos Escolares</p>
			<h1 id="titulo-pagina">Pagina inicial</h1>
			<p>Autenticacao concluida. Utilize as opcoes disponiveis para o seu perfil.</p>
		</section>

		<section class="card" sec:authorize="hasRole('ADMINISTRADOR')">
			<h2>Administracao de usuarios</h2>
			<p>Cadastre contas e atribua um dos tres perfis funcionais permitidos.</p>
			<a class="button button-primary" th:href="@{/admin/usuarios/cadastro}">Cadastrar usuario</a>
		</section>
	</main>
</body>
</html>
